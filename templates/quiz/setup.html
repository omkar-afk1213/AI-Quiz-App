{% extends 'base.html' %}

{% block title %}Quiz Setup | AI Quiz{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm border-0 quiz-card p-4">
      <h2 class="fw-bold mb-4">Create a Quiz</h2>
      <form method="POST" action="{{ url_for('quiz.setup') }}">
        <div class="mb-3">
          <label for="topic" class="form-label">Topic</label>
          <input type="text" class="form-control" id="topic" name="topic" placeholder="e.g. Python Basics" required>
        </div>
        <div class="mb-3">
          <label for="count" class="form-label">Number of Questions</label>
          <select class="form-select" id="count" name="count">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="difficulty" class="form-label">Difficulty</label>
          <select class="form-select" id="difficulty" name="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Generate Quiz</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
