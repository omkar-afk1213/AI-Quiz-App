{% extends 'base.html' %}

{% block title %}Set New Password | AI Quiz{% endblock %}

{% block content %}
<div class="auth-page d-flex align-items-center justify-content-center">
  <div class="card auth-card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
      <h2 class="fw-bold mb-2">Set New Password</h2>
      <p class="text-muted">Choose a new password with at least 6 characters.</p>
      <form method="POST">
        <label for="password" class="form-label">New password</label>
        <input type="password" id="password" name="password" class="form-control mb-3" minlength="6" required>
        <label for="confirm_password" class="form-label">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control mb-3" minlength="6" required>
        <button type="submit" class="btn btn-primary w-100">Reset Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
